# ============================================================
# WorkLoom CI 质量门禁（审计第 5 轮接入）
# 触发：push / PR to main
# 内容：typecheck + 三包测试（含 DB 集成）+ 视频合同/证据回归 + 全场景套件（326 用例）+ dsh-gate E6
# 注意：DB 集成测试必须真实 PG（RUN_DB_TESTS=1）——0.1.1 前全部 skip 曾掩盖 P0（#22）
# ============================================================
name: ci-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workloom
          POSTGRES_DB: workloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:workloom@localhost:5432/workloom
      DATABASE_APP_URL: postgres://workloom_app:workloom_dev_app@localhost:5432/workloom
      DATABASE_GATEWAY_URL: postgres://workloom_gateway:workloom_dev_gateway@localhost:5432/workloom
      APP_DB_PASSWORD: workloom_dev_app
      GATEWAY_DB_PASSWORD: workloom_dev_gateway
      JWT_SECRET: ci-gate-secret
      LLM_PROVIDER: mock
      IM_DRIVER: mock
      RUN_DB_TESTS: "1"
      TOOL_UNVERIFIED_RATE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      # 包内媒体用例（如 packages/base 的 bgm-measure-compatibility）会真实调用 ffmpeg/ffprobe；
      # CNB 的 test-gate 镜像自带 ffmpeg，GitHub runner 没有，缺装会把两个音频用例误判为失败。
      - name: 媒体工具（ffmpeg/ffprobe）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: GitHub UI 制品校验与原锁安装
        run: >-
          node scripts/ci/install-private-ui.mjs
          --repo .
          --store-dir "$RUNNER_TEMP/workloom-ui-store"
          --staging-root "$RUNNER_TEMP"
          --archive "$RUNNER_TEMP/workloom-ui-original.tgz"
          --report "$RUNNER_TEMP/workloom-ui-bootstrap.json"

      - name: UI 下载与安装边界回归
        env:
          WORKLOOM_UI_TEST_ARCHIVE_PATH: ${{ runner.temp }}/workloom-ui-original.tgz
        run: node --test --test-concurrency=1 scripts/ci/ui-auth-bootstrap.test.mjs scripts/ci/install-private-ui.test.mjs

      - name: Codex 正式视频入口与接入指南回归
        run: node --import tsx --test scripts/tools/codex-video-workflow.test.mjs scripts/tools/lib/codex-video-film.test.mjs scripts/tools/lib/edit-service-session.test.mjs scripts/ai-video-workbench-guide.test.mjs

      - name: Edit 原生 CLI、MCP 与客户端配置接入回归
        run: >-
          node --import tsx --test --test-concurrency=1
          scripts/edit-agent.test.mjs
          scripts/tools/edit-agent-workflow.test.mjs
          scripts/tools/edit-agent-setup.test.mjs

      - name: 行业包及已登记资产完整性
        run: node --import tsx scripts/bundle-governance.mts

      - name: typecheck 全包
        run: pnpm -r --if-present typecheck

      - name: 迁移 + 种子（H-1 完整率 100%）
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed # 幂等复跑（L1.4：全部冲突丢弃）

      - name: 哈希链全库验证（#32 口径）
        run: pnpm db:verify-chain

      - name: 发布前核心链路（真实数据库与服务，mock 模型）
        timeout-minutes: 10
        run: |
          set -eu
          export LLM_PROVIDER=mock IM_DRIVER=mock TOOL_UNVERIFIED_RATE=0
          pnpm -C apps/server start > /tmp/workloom-release-server.log 2>&1 &
          release_server_pid=$!
          trap 'kill "$release_server_pid" 2>/dev/null || true; cat /tmp/workloom-release-server.log' EXIT HUP INT TERM
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then break; fi
            kill -0 "$release_server_pid"
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health
          pnpm release:gate

      - name: shared/base/runtime 测试（DB 集成全开）
        run: |
          pnpm -C packages/shared test
          pnpm -C packages/base test
          pnpm -C packages/runtime test

      - name: 视频需求合同与本次 G1 证据回归（隔离模型）
        run: >-
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
          packages/video-studio/src/bullet-time.test.ts
          packages/video-studio/src/bullet-time-qc.test.ts
          packages/video-studio/src/first-pass.test.ts
          packages/video-studio/src/prompt-redlines.test.ts
          packages/video-studio/src/micromotion.test.ts
          packages/video-studio/src/shot-spec.test.ts
          packages/video-studio/src/vendor-requirement-entry.test.ts
          packages/video-studio/src/requirement-contract.test.ts
          packages/video-studio/src/requirement-contract-production-bridge.test.ts
          packages/video-studio/src/requirement-authority.test.ts
          packages/video-studio/src/prd-authority.test.ts
          packages/video-studio/src/prd-authority-bridge.test.ts
          packages/video-studio/src/rival-identity-scope.test.ts
          packages/video-studio/src/native-field-repair-sync.test.ts
          packages/video-studio/src/frozen-complete-field-preservation.test.ts
          packages/video-studio/src/prd-portrait-source.test.ts
          packages/video-studio/src/production-structured-native.test.ts
          packages/video-studio/src/scene-design-source.test.ts
          packages/video-studio/src/studio.test.ts
          packages/video-studio/src/builtin-character-library.test.ts
          packages/video-studio/src/studio-portrait-reuse.test.ts
          packages/video-studio/src/producer-gate.test.ts
          packages/video-studio/src/vendor-compat.test.ts
          packages/video-studio/src/silent-screenplay.test.ts
          packages/video-studio/src/creative-theme-contract.test.ts
          packages/video-studio/src/duration-projection.test.ts
          packages/video-studio/src/duration-projection-bridge.test.ts
          packages/video-studio/src/studio-compat-concurrency.test.ts
          packages/video-studio/src/marketing-prd-contract.test.ts
          packages/video-studio/src/marketing-prompt-contract.test.ts
          packages/video-studio/src/pipeline-router.test.ts
          packages/video-studio/src/production-client.test.ts
          apps/server/src/video/marketing-authority.test.ts
          apps/server/src/video/marketing-facts.test.ts
          apps/server/src/video/marketing-gate-evidence.test.ts
          apps/server/src/video/studio-worker.test.ts
          apps/server/src/video/approved-source-fields.test.ts
          apps/server/src/video/approved-source-plan.test.ts
          apps/server/src/video/approved-source-plan.pg.test.ts
          apps/server/src/video/approved-source-api.pg.test.ts
          apps/server/src/video/approved-source-worker.test.ts
          apps/server/src/video/approved-source-marketing.test.ts
          apps/server/src/video/approved-source-currentness.test.ts
          apps/web/src/extensions/ai-video/tests/prompt-repair.test.tsx
          apps/server/src/video/prompt-quality-gate.test.ts
          apps/server/src/video/g6-motion-obligations.test.ts
          apps/server/src/video/g6-rival-pass.test.ts
          apps/server/src/video/g6-race-camera.test.ts
          apps/server/src/video/g6-event-witness.test.ts
          apps/server/src/video/production-authority.test.ts
          apps/server/src/video/production-authority.pg.test.ts
          apps/server/src/video/production-router.test.ts
          apps/server/src/video/gate-policy.test.ts
          apps/server/src/video/gate-ledger-bridge.test.ts
          scripts/tools/edit-canonical-budget.test.ts
          scripts/tools/provider-budget-gateway.test.ts

      - name: 视频数据完整性与恢复回归（真实 PostgreSQL，离线供应商）
        env:
          WORKLOOM_TEST_ADMIN_URL: postgres://postgres:workloom@localhost:5432/workloom
          WORKLOOM_TEST_APP_PASSWORD: workloom_dev_app
          WORKLOOM_TEST_GATEWAY_PASSWORD: workloom_dev_gateway
        run: >-
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
          packages/video-studio/src/archive
          apps/server/src/video/archive
          apps/server/src/video/pipeline/
          apps/server/src/video/gen/
          apps/server/src/video/render-poller
          apps/server/src/video/render-cost-reconciliation.pg.test.ts
          apps/server/src/video/production-qualification-currentness.pg.test.ts
          apps/server/src/video/film-
          apps/server/src/video/marketing-presentation-integrity-r2.test.ts
          apps/server/src/video/marketing-search-fixture-r2.test.ts

      - name: 全场景套件（326 用例）
        run: pnpm suite

      - name: web 构建
        run: pnpm -C apps/web build

      - name: dsh-gate E6（围栏瀑布 + 事件桥 + H-5 崩溃重放）
        run: bash scripts/dsh-gate.sh
